<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cỗ Máy In Tiền v4.0 - Royal 3D Casino & DeFi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap');

        :root {
            --gold-primary: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.45);
            --emerald-neon: #10b981;
        }

        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #060911;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
            color: #f8fafc;
            overflow-x: hidden;
            padding-bottom: 92px;
        }

        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Casino Royal Felt Table */
        .casino-table {
            background: radial-gradient(ellipse at center, #0c3b28 0%, #051c12 75%, #020d08 100%);
            border: 3px solid #d97706;
            box-shadow: 
                inset 0 0 40px rgba(0,0,0,0.9),
                0 10px 30px rgba(0,0,0,0.7),
                0 0 18px rgba(245, 158, 11, 0.2);
            position: relative;
        }

        /* Stadium & Arena VIP Tables */
        .stadium-pitch {
            background: 
                radial-gradient(circle at 50% 25%, rgba(16, 185, 129, 0.25) 0%, transparent 60%),
                repeating-linear-gradient(
                    0deg,
                    #064e3b 0px,
                    #064e3b 24px,
                    #043f2e 24px,
                    #043f2e 48px
                );
            border: 3px solid #fbbf24;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.85), 0 12px 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        .nba-court {
            background: 
                radial-gradient(circle at 50% 20%, rgba(251, 146, 60, 0.3) 0%, transparent 60%),
                repeating-linear-gradient(
                    90deg,
                    #451a03 0px,
                    #451a03 18px,
                    #572205 18px,
                    #572205 36px
                );
            border: 3px solid #f97316;
            box-shadow: inset 0 0 55px rgba(0,0,0,0.85), 0 12px 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        .dart-lounge {
            background: radial-gradient(circle at 50% 45%, #1e1b4b 0%, #09071a 80%);
            border: 3px solid #ec4899;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 0 25px rgba(236, 72, 153, 0.25);
            position: relative;
            overflow: hidden;
        }

        /* Luxury Glass Card */
        .luxury-card {
            background: rgba(15, 21, 35, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 191, 36, 0.18);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
        }

        /* Bat Ngoc (Bowl for Nan Bat) */
        .nan-bowl {
            width: 205px;
            height: 205px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, #fde68a 0%, #d97706 38%, #78350f 78%, #291002 100%);
            box-shadow: 
                0 18px 40px rgba(0,0,0,0.95),
                inset 0 5px 15px rgba(255,255,255,0.65),
                inset 0 -10px 25px rgba(0,0,0,0.85),
                0 0 20px rgba(251, 191, 36, 0.45);
            border: 4px solid #fef08a;
            cursor: grab;
            touch-action: none;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.04s linear;
        }
        .nan-bowl:active {
            cursor: grabbing;
        }
        .nan-bowl::before {
            content: '';
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fef08a, #b45309 70%, #451a03);
            border: 3px solid #fde047;
            box-shadow: 0 6px 14px rgba(0,0,0,0.8);
        }
        .nan-bowl-ring {
            position: absolute;
            inset: 14px;
            border-radius: 50%;
            border: 2px dashed rgba(254, 240, 138, 0.5);
            pointer-events: none;
        }

        /* Plate under bowl */
        .jade-plate {
            width: 215px;
            height: 215px;
            border-radius: 50%;
            background: radial-gradient(circle, #f8fafc 0%, #cbd5e1 62%, #64748b 90%, #334155 100%);
            border: 7px solid #d97706;
            box-shadow: 
                inset 0 0 25px rgba(0,0,0,0.5),
                0 10px 25px rgba(0,0,0,0.85);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .jade-plate::after {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            border: 2px solid rgba(217, 119, 6, 0.35);
            pointer-events: none;
        }

        /* Shake Animation */
        @keyframes vigorousShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-15px, -10px) rotate(-9deg); }
            30% { transform: translate(15px, 8px) rotate(9deg); }
            45% { transform: translate(-14px, 10px) rotate(-7deg); }
            60% { transform: translate(12px, -8px) rotate(7deg); }
            75% { transform: translate(-10px, 5px) rotate(-5deg); }
            90% { transform: translate(8px, -4px) rotate(4deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shaking {
            animation: vigorousShake 0.24s infinite;
        }

        /* 3D Pip Dice on Plate */
        .dice-cube {
            width: 54px;
            height: 54px;
            background: linear-gradient(145deg, #ffffff, #e2e8f0);
            border-radius: 12px;
            box-shadow: 
                0 6px 12px rgba(0,0,0,0.6),
                inset 0 2px 4px rgba(255,255,255,1),
                inset 0 -3px 6px rgba(0,0,0,0.25);
            border: 1px solid #cbd5e1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 7px;
            gap: 3px;
        }
        .pip {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #1e293b;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }
        .pip.red {
            background: #dc2626;
            box-shadow: 0 0 4px rgba(220, 38, 38, 0.5), inset 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Slot Machine Reels */
        .slot-cabinet {
            background: linear-gradient(180deg, #451a03 0%, #1c0a00 100%);
            border: 4px solid #fbbf24;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.3), inset 0 0 25px rgba(0,0,0,0.9);
        }
        .slot-window {
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(255,255,255,0.05) 20%, rgba(255,255,255,0.05) 80%, rgba(0,0,0,0.85) 100%), #0f172a;
            height: 136px;
            overflow: hidden;
            position: relative;
            border: 3px solid #d97706;
            border-radius: 14px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.9), inset 0 -10px 20px rgba(0,0,0,0.9);
        }
        .slot-strip {
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }
        .slot-item {
            height: 136px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
            flex-shrink: 0;
        }

        /* Chip Styling */
        .casino-chip {
            position: relative;
            border-radius: 9999px;
            font-weight: 800;
            transition: all 0.15s ease;
            border: 2px dashed rgba(255,255,255,0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .casino-chip.active {
            transform: translateY(-4px) scale(1.06);
            border: 2px solid #fef08a;
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.85);
        }

        /* Door Active Glow */
        .bet-door {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bet-door.selected {
            border-color: #fbbf24 !important;
            background: linear-gradient(145deg, rgba(251, 191, 36, 0.28), rgba(180, 83, 9, 0.18)) !important;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.45), inset 0 0 12px rgba(251, 191, 36, 0.25);
            transform: scale(1.02);
        }

        /* Penalty Target Zones */
        .goal-zone {
            border: 2px dashed rgba(251, 191, 36, 0.55);
            background: radial-gradient(circle, rgba(251, 191, 36, 0.2) 0%, rgba(0,0,0,0.2) 100%);
            transition: all 0.2s;
        }
        .goal-zone:hover, .goal-zone.active-target {
            background: radial-gradient(circle, rgba(16, 185, 129, 0.55) 0%, rgba(16, 185, 129, 0.15) 100%);
            border: 2px solid #34d399;
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.8);
            transform: scale(1.08);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
